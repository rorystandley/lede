    <!--
      iOS standalone PWA launch images. iOS does NOT fall back to the manifest
      splash, so without these the app shows a blank white screen on launch.
      Portrait-only (the app is portrait-primary). Regenerate with
      `node scripts/generate-splash.mjs` — see that script for the device map.
    -->
    <link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/splash-640x1136.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style>
      /*
        Branded loading placeholder. Fills the viewport with the emerald brand
        field and the lede mark while the JS bundle boots, so there's no white
        gap between the OS launch splash and React mounting. React replaces
        #root on mount, so this needs no explicit cleanup.
      */
      @keyframes lede-splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body style="font-family: 'Inter', system-ui, sans-serif">
    <div id="root">
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 1.5rem;
          background-color: #12b981;
        "
      >
        <img
          src="/icon.svg"
          alt="lede"
          width="96"
          height="96"
          style="border-radius: 22px"
        />
        <div
          style="
            width: 1.5rem;
            height: 1.5rem;
            border: 3px solid rgba(255, 255, 255, 0.35);
            border-top-color: #ffffff;
            border-radius: 9999px;
            animation: lede-splash-spin 0.8s linear infinite;
          "
        ></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
