services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: newsreader
      POSTGRES_PASSWORD: newsreader
      POSTGRES_DB: newsreader
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
