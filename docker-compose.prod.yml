# Production overrides — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Splits app into separate web and worker services. Both share the same image
# but use PROCESS_ROLE to determine their behaviour.

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PROCESS_ROLE: web
      DATABASE_URL: postgresql://newsreader:newsreader@postgres:5432/newsreader
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PROCESS_ROLE: worker
      DATABASE_URL: postgresql://newsreader:newsreader@postgres:5432/newsreader
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      - postgres
      - redis
    command: ["node", "packages/backend/dist/worker.js"]
