<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Siftory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C2558"/>
      <stop offset="0.55" stop-color="#1A1538"/>
      <stop offset="1" stop-color="#100C24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.24" r="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D7DAF4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD680"/>
      <stop offset="1" stop-color="#F0A636"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>

  <!-- incoming stories -->
  <circle cx="206" cy="150" r="9" fill="#FFFFFF" fill-opacity="0.45"/>
  <circle cx="256" cy="142" r="9" fill="#FFFFFF" fill-opacity="0.45"/>
  <circle cx="306" cy="150" r="9" fill="#FFFFFF" fill-opacity="0.45"/>

  <g filter="url(#soft)">
    <!-- funnel / sieve -->
    <path d="M156 176 L356 176 L290 266 L290 320 Q290 332 278 332 L234 332 Q222 332 222 320 L222 266 Z" fill="url(#mark)"/>
    <!-- distilled story -->
    <circle cx="256" cy="366" r="14" fill="url(#accent)"/>
  </g>

  <rect x="0.75" y="0.75" width="510.5" height="510.5" rx="113.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
</svg>
