name: CI

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # weekly on Monday at 09:00 UTC
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan all commits

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # required to scan PR commits
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Advisory while existing findings are remediated. The weekly schedule also
      # surfaces newly disclosed high- and critical-severity vulnerabilities.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Generate coverage report
        run: pnpm coverage

      - name: Add coverage table to job summary
        run: |
          node scripts/render-coverage-table.mjs
          cat coverage/coverage-table.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: pnpm run build

      # Build above produces the backend dist the generator reads, so call the
      # script directly. Fails the PR if postman/ is out of date with the routes.
      - name: Check Postman collection is up to date
        run: node scripts/generate-postman.mjs --check
