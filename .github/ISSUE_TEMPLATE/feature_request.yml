name: Feature request
description: Suggest an idea or enhancement
title: "[Feature]: "
labels: ["type: feature", "status: triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that lede doesn't support today?
      placeholder: I want to mute a feed for a week without unsubscribing...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen? Rough is fine.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend / API
        - Frontend / Web UI
        - Feed ingestion / workers
        - MCP server
        - AI (summaries / digest)
        - Auth
        - Deployment / infra
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you use today, or other approaches you weighed.
    validations:
      required: false
